components:
  parameters:
    Order:
      in: query
      name: order
      deprecated: true
      schema:
        type: string
        enum:
        - asc
        - desc
    Sort:
      in: query
      name: sort
      explode: false
      description: 'Comma separated search fields. See: [Ordering](/#ordering)'
      schema:
        type: array
        items:
          type: string
          example: created_at:desc
    Page:
      in: query
      name: page
      schema:
        type: integer
        minimum: 1
    PerPage:
      in: query
      name: per_page
      schema:
        type: integer
        minimum: 1
        maximum: 100
  schemas:
    Practitioner:
      type: object
      properties:
        active:
          type:
          - boolean
          - 'null'
        appointment_types:
          deprecated: false
          type: object
          properties:
            links:
              type: object
              properties:
                self:
                  type: string
                  format: uri
                  example: https://api.au1.cliniko.com/v1/practitioners/1/appointment_types
        appointments:
          deprecated: false
          type: object
          properties:
            links:
              type: object
              properties:
                self:
                  type: string
                  format: uri
                  example: https://api.au1.cliniko.com/v1/practitioners/1/appointments
        created_at:
          type: string
          format: date-time
        default_appointment_type:
          deprecated: false
          type: object
          properties:
            links:
              type: object
              properties:
                self:
                  type: string
                  format: uri
                  example: https://api.au1.cliniko.com/v1/appointment_types/1
        description:
          type:
          - string
          - 'null'
        designation:
          type:
          - string
          - 'null'
          maxLength: 255
        display_name:
          type:
          - string
          - 'null'
        first_name:
          type:
          - string
          - 'null'
        id:
          type: string
          format: int64
        invoices:
          deprecated: false
          type: object
          properties:
            links:
              type: object
              properties:
                self:
                  type: string
                  format: uri
                  example: https://api.au1.cliniko.com/v1/practitioners/1/invoices
        label:
          type:
          - string
          - 'null'
        last_name:
          type:
          - string
          - 'null'
        links:
          type: object
          properties:
            self:
              type: string
              format: uri
              example: https://api.au1.cliniko.com/v1/practitioners/1
        practitioner_reference_numbers:
          deprecated: false
          type: object
          properties:
            links:
