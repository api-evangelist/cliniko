openapi: 3.2.0
info:
  title: Cliniko Practitioner API
  version: v1
  description: 'Operations tagged Practitioner across 2 of this provider''s published API definitions: cliniko-openapi.yml, cliniko-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.au1.cliniko.com/v1
  description: Production
security:
- basicAuth: []
tags:
- name: Practitioner
  description: 'All practitioners have an associated user account. Not all users are practitioners (e.g. receptionists wouldn''t be).


    You can only create appointments for practitioners (not for users).'
paths:
  /practitioners:
    get:
      tags:
      - Practitioner
      summary: List practitioners
      operationId: ListPractitioners-Get
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  practitioners:
                    type: array
                    items:
                      $ref: '#/components/schemas/Practitioner'
                  total_entries:
                    type: integer
                    example: 1
                  links:
                    type: object
                    properties:
                      self:
                        type: string
                        format: uri
                        example: https://api.au1.cliniko.com/v1/practitioners?page=2
                      previous:
                        type: string
                        format: uri
                        example: https://api.au1.cliniko.com/v1/practitioners?page=1
                      next:
                        type: string
                        format: uri
                        example: https://api.au1.cliniko.com/v1/practitioners?page=3
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/Order'
      - in: query
        name: q[]
        description: 'Filter result by one or more fields.


          See [Filtering Results](/#filtering-results)


          Available filters:


          | Value | Format |

          |---|---|

          | active | [boolean](/#boolean-filter-operators) |

          | created_at | [date-time](/#datetime-filter-operators) |

          | id | [int64](/#numeric-filter-operators) |

          | show_in_online_bookings | [boolean](/#boolean-filter-operators) |

          | updated_at | [date-time](/#datetime-filter-operators) |

          | user_id | [int64](/#numeric-filter-operators) |

          '
        schema:
          type: array
          items:
            type: string
    servers:
    - url: https://api.au1.cliniko.com/v1
      description: Production
