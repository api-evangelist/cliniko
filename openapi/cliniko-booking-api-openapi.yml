openapi: 3.2.0
info:
  title: Cliniko Booking API
  version: v1
  description: 'Operations tagged Booking across 2 of this provider''s published API definitions: cliniko-openapi.yml, cliniko-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.au1.cliniko.com/v1
  description: Production
security:
- basicAuth: []
tags:
- name: Booking
paths:
  /bookings:
    get:
      tags:
      - Booking
      summary: List bookings
      operationId: ListBookings-Get
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  bookings:
                    type: array
                    items:
                      $ref: '#/components/schemas/Booking'
                  total_entries:
                    type: integer
                    example: 1
                  links:
                    type: object
                    properties:
                      self:
                        type: string
                        format: uri
                        example: https://api.au1.cliniko.com/v1/bookings?page=2
                      previous:
                        type: string
                        format: uri
                        example: https://api.au1.cliniko.com/v1/bookings?page=1
                      next:
                        type: string
                        format: uri
                        example: https://api.au1.cliniko.com/v1/bookings?page=3
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/Order'
      - in: query
        name: q[]
        description: 'Filter result by one or more fields.


          See [Filtering Results](/#filtering-results)


          Available filters:


          | Value | Format |

          |---|---|

          | appointment_type_id | [int64](/#numeric-filter-operators) |

          | archived_at | [date-time](/#datetime-filter-operators) |

          | business_id | [int64](/#numeric-filter-operators) |

          | cancelled_at | [date-time](/#datetime-filter-operators) |

          | created_at | [date-time](/#datetime-filter-operators) |

          | deleted_at | [date-time](/#datetime-filter-operators) |

          | did_not_arrive | [boolean](/#boolean-filter-operators) |

          | email_reminder_sent | [boolean](/#boolean-filter-operators) |

          | ends_at | [date-time](/#datetime-filter-operators) |

          | id | [int64](/#numeric-filter-operators) |

          | invoice_status | [integer](/#numeric-filter-operators) |

          | patient_ids | [array](/#array-filter-operators) |

          | practitioner_id | [int64](/#numeric-filter-operators) |

          | repeated_from_id | [int64](/#numeric-filter-operators) |

          | sms_reminder_sent | [boolean](/#boolean-filter-operators) |

          | starts_at | [date-time](/#datetime-filter-operators) |

          | treatment_note_status | [integer](/#numeric-filter-operators) |

          | updated_at | [date-time](/#datetime-filter-operators) |

          '
        schema:
          type: array
          items:
            type: string
    servers:
    - url: https://api.au1.cliniko.com/v1
      description: Production
  /bookings/{id}:
    get:
      tags:
      - Booking
      summary: Get booking
      operationId: GetBooking-Get
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: int64
      - in: query
        name: q[]
        description: 'Filter result by one or more fields.


          See [Filtering Results](/#filtering-results)


          Available filters:


          | Value | Format |

          |---|---|

          | archived_at | [date-time](/#datetime-filter-operators) |

          | cancelled_at | [date-time](/#datetime-filter-operators) |

          | deleted_at | [date-time](/#datetime-filter-operators) |

          '
        schema:
          type: array
          items:
            type: string
    servers:
    - url: https://api.au1.cliniko.com/v1
      description: Production
  /patient_cases/{patient_case_id}/bookings:
    get:
      tags:
      - Booking
      summary: List bookings for patient case
      operationId: ListBookingsForPatientCase-Get
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  bookings:
                    type: array
                    items:
                      $ref: '#/components/schemas/Booking'
                  total_entries:
                    type: integer
                    example: 1
                  links:
                    type: object
                    properties:
                      self:
                        type: string
                        format: uri
                        example: https://api.au1.cliniko.com/v1/patient_cases/1/bookings?page=2
                      previous:
                        type: string
                        format: uri
                        example: https://api.au1.cliniko.com/v1/patient_cases/1/bookings?page=1
                      next:
                        type: string
                        format: uri
                        example: https://api.au1.cliniko.com/v1/patient_cases/1/bookings?page=3
      deprecated: true
      parameters:
      - name: patient_case_id
        in: path
        required: true
        schema:
          type: string
          format: int64
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/Order'
      - in: query
        name: q[]
        description: 'Filter result by one or more fields.


          See [Filtering Results](/#filtering-results)


          Available filters:


          | Value | Format |

          |---|---|

          | appointment_type_id | [int64](/#numeric-filter-operators) |

          | archived_at | [date-time](/#datetime-filter-operators) |

          | business_id | [int64](/#numeric-filter-operators) |

          | cancelled_at | [date-time](/#datetime-filter-operators) |

          | created_at | [date-time](/#datetime-filter-operators) |

          | deleted_at | [date-time](/#datetime-filter-operators) |

          | did_not_arrive | [boolean](/#boolean-filter-operators) |

          | email_reminder_sent | [boolean](/#boolean-filter-operators) |

          | ends_at | [date-time](/#datetime-filter-operators) |

          | id | [int64](/#numeric-filter-operators) |

          | invoice_status | [integer](/#numeric-filter-operators) |

          | patient_ids | [array](/#array-filter-operators) |

          | practitioner_id | [int64](/#numeric-filter-operators) |

          | repeated_from_id | [int64](/#numeric-filter-operators) |

          | sms_reminder_sent | [boolean](/#boolean-filter-operators) |

          | starts_at | [date-time](/#datetime-filter-operators) |

          | treatment_note_status | [integer](/#numeric-filter-operators) |

          | updated_at | [date-time](/#datetime-filter-operators) |

          '
        schema:
          type: array
          items:
            type: string
    servers:
    - url: https://api.au1.cliniko.com/v1
      description: Production
