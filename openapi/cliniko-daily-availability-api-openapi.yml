openapi: 3.2.0
info:
  title: Cliniko Daily Availability API
  version: v1
  description: 'Operations tagged Daily Availability across 2 of this provider''s published API definitions: cliniko-openapi.yml, cliniko-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.au1.cliniko.com/v1
  description: Production
security:
- basicAuth: []
tags:
- name: Daily Availability
  description: The regularly scheduled availabilities of a practitioner at a business
paths:
  /daily_availabilities:
    get:
      tags:
      - Daily Availability
      summary: List daily availabilities
      operationId: ListDailyAvailabilities-Get
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  daily_availabilities:
                    type: array
                    items:
                      $ref: '#/components/schemas/DailyAvailability'
                  total_entries:
                    type: integer
                    example: 1
                  links:
                    type: object
                    properties:
                      self:
                        type: string
                        format: uri
                        example: https://api.au1.cliniko.com/v1/daily_availabilities?page=2
                      previous:
                        type: string
                        format: uri
                        example: https://api.au1.cliniko.com/v1/daily_availabilities?page=1
                      next:
                        type: string
                        format: uri
                        example: https://api.au1.cliniko.com/v1/daily_availabilities?page=3
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/Order'
      - in: query
        name: q[]
        description: 'Filter result by one or more fields.


          See [Filtering Results](/#filtering-results)


          Available filters:


          | Value | Format |

          |---|---|

          | business_id | [int64](/#numeric-filter-operators) |

          | created_at | [date-time](/#datetime-filter-operators) |

          | id | [int64](/#numeric-filter-operators) |

          | practitioner_id | [int64](/#numeric-filter-operators) |

          | updated_at | [date-time](/#datetime-filter-operators) |

          '
        schema:
          type: array
          items:
            type: string
    servers:
    - url: https://api.au1.cliniko.com/v1
      description: Production
  /daily_availabilities/{id}:
    get:
      tags:
      - Daily Availability
      summary: Get daily availability
      operationId: GetDailyAvailability-Get
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyAvailability'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: int64
    servers:
    - url: https://api.au1.cliniko.com/v1
      description: Production
  /businesses/{business_id}/daily_availabilities:
    get:
      tags:
      - Daily Availability
      summary: List daily availabilities for business
      operationId: ListDailyAvailabilitiesForBusiness-Get
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  daily_availabilities:
                    type: array
                    items:
                      $ref: '#/components/schemas/DailyAvailability'
                  total_entries:
                    type: integer
                    example: 1
                  links:
                    type: object
                    properties:
                      self:
                        type: string
                        format: uri
                        example: https://api.au1.cliniko.com/v1/businesses/1/daily_availabilities?page=2
                      previous:
                        type: string
                        format: uri
                        example: https://api.au1.cliniko.com/v1/businesses/1/daily_availabilities?page=1
                      next:
                        type: string
                        format: uri
                        example: https://api.au1.cliniko.com/v1/businesses/1/daily_availabilities?page=3
      parameters:
      - name: business_id
        in: path
        required: true
        schema:
          type: string
          format: int64
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/Order'
      - in: query
        name: q[]
        description: 'Filter result by one or more fields.


          See [Filtering Results](/#filtering-results)


          Available filters:


          | Value | Format |

          |---|---|

          | created_at | [date-time](/#datetime-filter-operators) |

          | id | [int64](/#numeric-filter-operators) |

          | practitioner_id | [int64](/#numeric-filter-operators) |

          | updated_at | [date-time](/#datetime-filter-operators) |

          '
        schema:
          type: array
          items:
            type: string
    servers:
    - url: https://api.au1.cliniko.com/v1
      description: Production
  /practitioners/{practitioner_id}/daily_availabilities:
    get:
      tags:
      - Daily Availability
      summary: List daily availabilities for practitioner
      operationId: ListDailyAvailabilitiesForPractitioner-Get
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  daily_availabilities:
                    type: array
                    items:
                      $ref: '#/components/schemas/DailyAvailability'
                  total_entries:
                    type: integer
                    example: 1
                  links:
                    type: object
                    properties:
                      self:
                        type: string
                        format: uri
                        example: https://api.au1.cliniko.com/v1/practitioners/1/daily_availabilities?page=2
                      previous:
                        type: string
                        format: uri
                        example: https://api.au1.cliniko.com/v1/practitioners/1/daily_availabilities?page=1
                      next:
                        type: string
                        format: uri
                        example: https://api.au1.cliniko.com/v1/practitioners/1/daily_availabilities?page=3
      parameters:
      - name: practitioner_id
        in: path
        required: true
        schema:
          type: string
          format: int64
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/Order'
      - in: query
        name: q[]
        description: 'Filter result by one or more fields.


          See [Filtering Results](/#filtering-results)


          Available filters:


          | Value | Format |

          |---|---|

          | business_id | [int64](/#numeric-filter-operators) |

          | created_at | [date-time](/#datetime-filter-operators) |

          | id | [int64](/#numeric-filter-operators) |

          | updated_at | [date-time](/#datetime-filter-operators) |

          '
        schema:
          type: array
          items:
            type: string
    servers:
    - url: https://api.au1.cliniko.com/v1
      description: Production
components:
  parameters:
    Order:
      in: query
      name: order
      deprecated: true
      schema:
        type: string
        enum:
        - asc
        - desc
    Sort:
      in: query
      name: sort
      explode: false
      description: 'Comma separated search fields. See: [Ordering](/#ordering)'
      schema:
        type: array
        items:
          type: string
          example: created_at:desc
    Page:
      in: query
      name: page
      schema:
        type: integer
        minimum: 1
    PerPage:
      in: query
      name: per_page
      schema:
        type: integer
        minimum: 1
        maximum: 100
  schemas:
    DailyAvailability:
      type: object
      properties:
        availabilities:
          type:
          - array
          - 'null'
          items:
            properties:
              ends_at:
                example: '13:00'
                format: time
                type: string
              starts_at:
                example: 09:00
                format: time
                type: string
            type: object
        business:
          deprecated: false
          type: object
          properties:
            links:
              type: object
              properties:
                self:
                  type: string
                  format: uri
                  example: https://api.au1.cliniko.com/v1/businesses/1
        created_at:
          type: string
          format: date-time
        day_of_week:
          type: integer
          enum:
          - 0
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
        id:
          type: string
          format: int64
        links:
          type: object
          properties:
            self:
              type: string
              format: uri
              example: https://api.au1.cliniko.com/v1/daily_availabilities/1
        practitioner:
          deprecated: false
          type: object
          properties:
            links:
              type: object
              properties:
                self:
                  type: string
                  format: uri
                  example: https://api.au1.cliniko.com/v1/practitioners/1
        time_zone:
          type:
          - string
          - 'null'
          description: 'See: [supported time zones](/guides/time_zone_support/#accepted-values-for-time_zone)'
          example: Melbourne
        time_zone_identifier:
          type:
          - string
          - 'null'
          description: 'See: [supported time zone identifiers](/guides/time_zone_support/#accepted-values-for-time_zone_identifier)'
          example: Australia/Melbourne
        updated_at:
          type: string
          format: date-time
      x-tags:
      - Daily Availability
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
externalDocs:
  description: Clinko API Developers Group
  url: https://groups.google.com/a/redguava.com.au/d/forum/cliniko-api
