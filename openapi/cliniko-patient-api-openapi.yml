openapi: 3.2.0
info:
  title: Cliniko Patient API
  version: v1
  description: 'Operations tagged Patient across 2 of this provider''s published API definitions: cliniko-openapi.yml, cliniko-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.au1.cliniko.com/v1
  description: Production
security:
- basicAuth: []
tags:
- name: Patient
  description: 'Patients are the people that book in for appointments. There isn''t much in Cliniko that doesn''t revolve around

    patients.


    When you''re working with patient information, make sure you abide by the relevant regulations for security and

    privacy.


    A couple of fields in the patient record deserve special consideration:


    `accepted_privacy_policy` stores the patient''s consent to the business''s own privacy policy. Values can be null

    (no response), true (accepted) or false (rejected). Please consider how this may affect you storing information

    on this patient.


    `time_zone` will contain a valid IANA time zone identifier if the patient''s time zone has been set, or null if it

    hasn''t. It can be set via the API, in which case it accepts IANA time zone identifiers.'
paths:
  /patients:
    get:
      tags:
      - Patient
      summary: List patients
      operationId: ListPatients-Get
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  patients:
                    type: array
                    items:
                      $ref: '#/components/schemas/Patient'
                  total_entries:
                    type: integer
                    example: 1
                  links:
                    type: object
                    properties:
                      self:
                        type: string
                        format: uri
                        example: https://api.au1.cliniko.com/v1/patients?page=2
                      previous:
                        type: string
                        format: uri
                        example: https://api.au1.cliniko.com/v1/patients?page=1
                      next:
                        type: string
                        format: uri
                        example: https://api.au1.cliniko.com/v1/patients?page=3
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/Order'
      - in: query
        name: q[]
        description: 'Filter result by one or more fields.


          See [Filtering Results](/#filtering-results)


          Available filters:


          | Value | Format |

          |---|---|

          | accepted_privacy_policy | [boolean](/#boolean-filter-operators) |

          | archived_at | [date-time](/#datetime-filter-operators) |

          | created_at | [date-time](/#datetime-filter-operators) |

          | date_of_birth | [date](/#date-filter-operators) |

          | email | [string](/#string-filter-operators) |

          | first_name | [string](/#string-filter-operators) |

          | id | [int64](/#numeric-filter-operators) |

          | last_name | [string](/#string-filter-operators) |

          | old_reference_id | [string](/#string-filter-operators) |

          | preferred_first_name | [string](/#string-filter-operators) |

          | updated_at | [date-time](/#datetime-filter-operators) |

          '
        schema:
          type: array
          items:
            type: string
    post:
      tags:
      - Patient
      summary: Create patient
      operationId: CreatePatient-Post
      responses:
        '201':
          description: Resource was created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '422':
          $ref: '#/components/responses/ValidationError'
      requestBody:
        $ref: '#/components/requestBodies/Patient'
    servers:
    - url: https://api.au1.cliniko.com/v1
      description: Production
  /patients/{id}:
    get:
      tags:
      - Patient
      summary: Get patient
      operationId: GetPatient-Get
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: int64
      - in: query
        name: q[]
        description: 'Filter result by one or more fields.


          See [Filtering Results](/#filtering-results)


          Available filters:


          | Value | Format |

          |---|---|

          | archived_at | [date-time](/#datetime-filter-operators) |

          '
        schema:
          type: array
          items:
            type: string
    patch:
      tags:
      - Patient
      summary: Update patient
      operationId: UpdatePatient-Patch
      responses:
        '200':
          description: Resource was updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '422':
          $ref: '#/components/responses/ValidationError'
      requestBody:
        $ref: '#/components/requestBodies/Patient'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: int64
    delete:
      tags:
      - Patient
      summary: Archive patient
      operationId: ArchivePatient-Delete
      responses:
        '204':
          description: Resource was archived successfully
      deprecated: true
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: int64
    servers:
    - url: https://api.au1.cliniko.com/v1
      description: Production
  /patients/{id}/archive:
    post:
      tags:
      - Patient
      summary: Archive patient
      operationId: ArchivePatient-Post
      responses:
        '204':
          description: Resource was archived
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: int64
    servers:
    - url: https://api.au1.cliniko.com/v1
      description: Production
  /patients/{id}/unarchive:
    post:
      tags:
      - Patient
      summary: Unarchive patient
      operationId: UnarchivePatient-Post
      responses:
        '200':
          description: Resource was unarchived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: int64
    servers:
    - url: https://api.au1.cliniko.com/v1
      description: Production
