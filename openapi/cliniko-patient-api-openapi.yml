                      - $ref: '#/components/schemas/PatientCustomFieldParagraph'
                      - $ref: '#/components/schemas/PatientCustomFieldDate'
                      - $ref: '#/components/schemas/PatientCustomFieldCheckboxes'
                      - $ref: '#/components/schemas/PatientCustomFieldRadiobuttons'
