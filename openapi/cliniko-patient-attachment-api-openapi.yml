openapi: 3.2.0
info:
  title: Cliniko Patient Attachment API
  version: v1
  description: 'Operations tagged Patient Attachment across 2 of this provider''s published API definitions: cliniko-openapi.yml, cliniko-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.au1.cliniko.com/v1
  description: Production
security:
- basicAuth: []
tags:
- name: Patient Attachment
paths:
  /patient_attachments:
    get:
      tags:
      - Patient Attachment
      summary: List patient attachments
      operationId: ListPatientAttachments-Get
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  patient_attachments:
                    type: array
                    items:
                      $ref: '#/components/schemas/PatientAttachment'
                  total_entries:
                    type: integer
                    example: 1
                  links:
                    type: object
                    properties:
                      self:
                        type: string
                        format: uri
                        example: https://api.au1.cliniko.com/v1/patient_attachments?page=2
                      previous:
                        type: string
                        format: uri
                        example: https://api.au1.cliniko.com/v1/patient_attachments?page=1
                      next:
                        type: string
                        format: uri
                        example: https://api.au1.cliniko.com/v1/patient_attachments?page=3
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/Order'
      - in: query
        name: q[]
        description: 'Filter result by one or more fields.


          See [Filtering Results](/#filtering-results)


          Available filters:


          | Value | Format |

          |---|---|

          | archived_at | [date-time](/#datetime-filter-operators) |

          | category | [string](/#string-filter-operators) |

          | content_type | [string](/#string-filter-operators) |

          | created_at | [date-time](/#datetime-filter-operators) |

          | description | [string](/#string-filter-operators) |

          | filename | [string](/#string-filter-operators) |

          | id | [int64](/#numeric-filter-operators) |

          | patient_id | [int64](/#numeric-filter-operators) |

          | processed_at | [date-time](/#datetime-filter-operators) |

          | size | [int64](/#numeric-filter-operators) |

          | updated_at | [date-time](/#datetime-filter-operators) |

          | user_id | [int64](/#numeric-filter-operators) |

          '
        schema:
          type: array
          items:
            type: string
    post:
      tags:
      - Patient Attachment
      summary: Create uploaded patient attachment
      operationId: CreateUploadedPatientAttachment-Post
      responses:
        '201':
          description: Resource was created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadedPatientAttachment'
        '422':
          $ref: '#/components/responses/ValidationError'
      requestBody:
        $ref: '#/components/requestBodies/UploadedPatientAttachmentCreate'
      description: To create a patient attachment, you must first generate a presigned URL, upload your file to that URL, and then supply that URL and response key in the `upload_url` request body parameter.
      externalDocs:
        description: Uploading patient attachments
        url: /guides/uploading_patient_attachments/
    servers:
    - url: https://api.au1.cliniko.com/v1
      description: Production
  /patient_attachments/{id}:
    get:
      tags:
      - Patient Attachment
      summary: Get patient attachment
      operationId: GetPatientAttachment-Get
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientAttachment'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: int64
      - in: query
        name: q[]
        description: 'Filter result by one or more fields.


          See [Filtering Results](/#filtering-results)


          Available filters:


          | Value | Format |

          |---|---|

          | archived_at | [date-time](/#datetime-filter-operators) |

          '
        schema:
          type: array
          items:
            type: string
    patch:
      tags:
      - Patient Attachment
      summary: Update patient attachment
      operationId: UpdatePatientAttachment-Patch
      responses:
        '200':
          description: Resource was updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientAttachment'
        '422':
          $ref: '#/components/responses/ValidationError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/FullPatientExportBody'
              - $ref: '#/components/schemas/TreatmentNoteHistoryExportBody'
              - $ref: '#/components/schemas/UploadedPatientAttachmentBody'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: int64
    delete:
      tags:
      - Patient Attachment
      summary: Archive patient attachment
      operationId: DeletePatientAttachment-Delete
      responses:
        '204':
          description: Resource was archived successfully
      deprecated: true
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: int64
    servers:
    - url: https://api.au1.cliniko.com/v1
      description: Production
  /patient_attachments/{id}/archive:
    post:
      tags:
      - Patient Attachment
      summary: Archive patient attachment
      operationId: ArchivePatientAttachment-Post
      responses:
        '204':
          description: Resource was archived
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: int64
    servers:
    - url: https://api.au1.cliniko.com/v1
      description: Production
  /patient_cases/{patient_case_id}/patient_attachments:
    get:
      tags:
      - Patient Attachment
      summary: List patient attachments for patient case
      operationId: ListPatientAttachmentsForPatientCase-Get
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  patient_attachments:
                    type: array
                    items:
                      $ref: '#/components/schemas/PatientAttachment'
