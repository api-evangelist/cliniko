                    example: 1
                  links:
                    type: object
                    properties:
                      self:
                        type: string
                        format: uri
                        example: https://api.au1.cliniko.com/v1/patient_cases/1/patient_attachments?page=2
                      previous:
                        type: string
                        format: uri
                        example: https://api.au1.cliniko.com/v1/patient_cases/1/patient_attachments?page=1
                      next:
                        type: string
                        format: uri
                        example: https://api.au1.cliniko.com/v1/patient_cases/1/patient_attachments?page=3
      parameters:
      - name: patient_case_id
        in: path
        required: true
        schema:
          type: string
          format: int64
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/Order'
      - in: query
        name: q[]
        description: 'Filter result by one or more fields.


          See [Filtering Results](/#filtering-results)


          Available filters:


          | Value | Format |

          |---|---|

          | archived_at | [date-time](/#datetime-filter-operators) |

          | category | [string](/#string-filter-operators) |

          | content_type | [string](/#string-filter-operators) |

          | created_at | [date-time](/#datetime-filter-operators) |

          | description | [string](/#string-filter-operators) |

          | filename | [string](/#string-filter-operators) |

          | id | [int64](/#numeric-filter-operators) |

          | patient_id | [int64](/#numeric-filter-operators) |

          | processed_at | [date-time](/#datetime-filter-operators) |

          | size | [int64](/#numeric-filter-operators) |

          | updated_at | [date-time](/#datetime-filter-operators) |

          | user_id | [int64](/#numeric-filter-operators) |

          '
        schema:
          type: array
          items:
            type: string
    servers:
    - url: https://api.au1.cliniko.com/v1
      description: Production
  /patients/{patient_id}/attachment_presigned_post:
    get:
      tags:
      - Patient Attachment
      summary: Get a presigned URL to upload your file to S3
      operationId: PresignedPost-Get
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentPresignedPost'
      parameters:
      - in: path
        name: patient_id
        required: true
        schema:
          example: '1'
          format: int64
          type: string
      externalDocs:
        description: Uploading patient attachments
        url: /guides/uploading_patient_attachments/
    servers:
    - url: https://api.au1.cliniko.com/v1
      description: Production
  /patients/{patient_id}/patient_attachments:
    get:
      tags:
      - Patient Attachment
      summary: List patient attachments for patient
      operationId: ListPatientAttachmentsForPatient-Get
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  patient_attachments:
                    type: array
                    items:
                      $ref: '#/components/schemas/PatientAttachment'
                  total_entries:
                    type: integer
                    example: 1
                  links:
                    type: object
                    properties:
                      self:
                        type: string
                        format: uri
                        example: https://api.au1.cliniko.com/v1/patients/1/patient_attachments?page=2
                      previous:
                        type: string
                        format: uri
                        example: https://api.au1.cliniko.com/v1/patients/1/patient_attachments?page=1
                      next:
                        type: string
                        format: uri
                        example: https://api.au1.cliniko.com/v1/patients/1/patient_attachments?page=3
      deprecated: true
      parameters:
      - name: patient_id
        in: path
        required: true
        schema:
          type: string
          format: int64
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/Order'
      - in: query
        name: q[]
        description: 'Filter result by one or more fields.


          See [Filtering Results](/#filtering-results)


          Available filters:


          | Value | Format |

          |---|---|

          | archived_at | [date-time](/#datetime-filter-operators) |

          | category | [string](/#string-filter-operators) |

          | content_type | [string](/#string-filter-operators) |

