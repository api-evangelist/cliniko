openapi: 3.2.0
info:
  title: Cliniko Invoice API
  version: v1
  description: 'Operations tagged Invoice across 2 of this provider''s published API definitions: cliniko-openapi.yml, cliniko-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.au1.cliniko.com/v1
  description: Production
security:
- basicAuth: []
tags:
- name: Invoice
paths:
  /invoices:
    get:
      tags:
      - Invoice
      summary: List invoices
      operationId: ListInvoices-Get
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  invoices:
                    type: array
                    items:
                      $ref: '#/components/schemas/Invoice'
                  total_entries:
                    type: integer
                    example: 1
                  links:
                    type: object
                    properties:
                      self:
                        type: string
                        format: uri
                        example: https://api.au1.cliniko.com/v1/invoices?page=2
                      previous:
                        type: string
                        format: uri
                        example: https://api.au1.cliniko.com/v1/invoices?page=1
                      next:
                        type: string
                        format: uri
                        example: https://api.au1.cliniko.com/v1/invoices?page=3
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/Order'
      - in: query
        name: q[]
        description: 'Filter result by one or more fields.


          See [Filtering Results](/#filtering-results)


          Available filters:


          | Value | Format |

          |---|---|

          | appointment_id | [int64](/#numeric-filter-operators) |

          | archived_at | [date-time](/#datetime-filter-operators) |

          | attendee_id | [int64](/#numeric-filter-operators) |

          | business_id | [int64](/#numeric-filter-operators) |

          | closed_at | [date-time](/#datetime-filter-operators) |

          | created_at | [date-time](/#datetime-filter-operators) |

          | deleted_at | [date-time](/#datetime-filter-operators) |

          | id | [int64](/#numeric-filter-operators) |

          | issue_date | [date](/#date-filter-operators) |

          | number | [integer](/#numeric-filter-operators) |

          | original_invoice_id | [int64](/#numeric-filter-operators) |

          | patient_id | [int64](/#numeric-filter-operators) |

          | practitioner_id | [int64](/#numeric-filter-operators) |

          | status | [integer](/#numeric-filter-operators) |

          | updated_at | [date-time](/#datetime-filter-operators) |

          '
        schema:
          type: array
          items:
            type: string
    servers:
    - url: https://api.au1.cliniko.com/v1
      description: Production
  /invoices/{id}:
    get:
      tags:
      - Invoice
      summary: Get invoice
      operationId: GetInvoice-Get
