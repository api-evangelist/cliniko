          properties:
            links:
              type: object
              properties:
                self:
                  type: string
                  format: uri
                  example: https://api.au1.cliniko.com/v1/businesses/1
        calculation_method:
          type:
          - integer
          - 'null'
          enum:
          - 1
          - 2
          - 3
          description: '| Enum Value | Description |

            |---|---|

            | 1 | Legacy |

            | 2 | Tax exclusive |

            | 3 | Tax inclusive |'
        calculation_method_description:
          type:
          - string
          - 'null'
          enum:
          - Legacy
          - Tax exclusive
          - Tax inclusive
        closed_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
        deleted_at:
          type:
          - string
          - 'null'
          format: date-time
        discounted_amount:
          type:
          - string
          - 'null'
          format: decimal
        id:
          type: string
          format: int64
        invoice_items:
          deprecated: false
          type: object
          properties:
            links:
              type: object
              properties:
                self:
                  type: string
                  format: uri
                  example: https://api.au1.cliniko.com/v1/invoices/1/invoice_items
        invoice_to:
          type:
          - string
          - 'null'
        issue_date:
          type: string
          format: date
        links:
          type: object
          properties:
            self:
              type: string
              format: uri
              example: https://api.au1.cliniko.com/v1/invoices/1
        net_amount:
          type:
          - string
          - 'null'
          format: decimal
        notes:
          type:
          - string
          - 'null'
        number:
          type: integer
        online_payment_url:
          type:
          - string
          - 'null'
          format: uri
        original_invoice:
          deprecated: false
          type: object
          properties:
            links:
              type: object
              properties:
                self:
                  type: string
                  format: uri
                  example: https://api.au1.cliniko.com/v1/invoices/1
        patient:
          deprecated: false
          type: object
          properties:
            links:
              type: object
              properties:
                self:
                  type: string
                  format: uri
                  example: https://api.au1.cliniko.com/v1/patients/1
        patient_extra_information:
          type:
          - string
          - 'null'
        practitioner:
          deprecated: false
          type: object
          properties:
            links:
              type: object
              properties:
                self:
                  type: string
                  format: uri
                  example: https://api.au1.cliniko.com/v1/practitioners/1
        reversed_invoices:
          deprecated: false
          type: object
          properties:
            links:
              type: object
              properties:
                self:
                  type: string
                  format: uri
                  example: https://api.au1.cliniko.com/v1/invoices?q%5B%5D=invoice_id%3A%3D1
        signature:
          deprecated: false
          type: object
          properties:
            links:
              type: object
              properties:
                self:
                  type: string
                  format: uri
                  example: https://api.au1.cliniko.com/v1/signatures/1
        status:
          type:
          - integer
          - 'null'
          enum:
          - 10
          - 20
          - 30
          - 40
          description: '| Enum Value | Description |

            |---|---|

            | 10 | Open |

            | 20 | Paid |

            | 30 | Closed |

            | 40 | Open credit |'
        status_description:
          type:
          - string
          - 'null'
          enum:
          - Open
          - Paid
          - Closed
          - Open credit
        tax_amount:
          type:
          - string
          - 'null'
          format: decimal
        total_amount:
          type:
          - string
          - 'null'
          format: decimal
        updated_at:
          type: string
          format: date-time
