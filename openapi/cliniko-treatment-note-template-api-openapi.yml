openapi: 3.2.0
info:
  title: Cliniko Treatment Note Template API
  version: v1
  description: 'Operations tagged Treatment Note Template across 2 of this provider''s published API definitions: cliniko-openapi.yml, cliniko-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.au1.cliniko.com/v1
  description: Production
security:
- basicAuth: []
tags:
- name: Treatment Note Template
  description: 'Templates that are the starting point for treatment notes.


    HTML is supported in answers to paragraph questions. We sanitize these answers to ensure the HTML is safe

    and our editor can support the formatting.


    Currently, the following tags are supported: `p`, `div`, `br`, `ul`, `ol`, `li`, `blockquote`, `h1`, `h2`, `b`, `i`, `u`, and `a`.


    The angle bracket characters (``) should be sent as html encodings (ex: `<` should be sent as `<`).


    Content inside unescaped angle brackets could be identified as unsupported HTML and will be stripped.'
paths:
  /treatment_note_templates:
    get:
      tags:
      - Treatment Note Template
      summary: List treatment note templates
      operationId: ListTreatmentNoteTemplates-Get
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  treatment_note_templates:
                    type: array
                    items:
                      $ref: '#/components/schemas/TreatmentNoteTemplate'
                  total_entries:
                    type: integer
                    example: 1
                  links:
                    type: object
                    properties:
                      self:
                        type: string
                        format: uri
                        example: https://api.au1.cliniko.com/v1/treatment_note_templates?page=2
                      previous:
                        type: string
                        format: uri
                        example: https://api.au1.cliniko.com/v1/treatment_note_templates?page=1
                      next:
                        type: string
                        format: uri
                        example: https://api.au1.cliniko.com/v1/treatment_note_templates?page=3
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/Order'
      - in: query
        name: q[]
        description: 'Filter result by one or more fields.


          See [Filtering Results](/#filtering-results)


          Available filters:


          | Value | Format |

          |---|---|

          | archived_at | [date-time](/#datetime-filter-operators) |

          | created_at | [date-time](/#datetime-filter-operators) |

          | deleted_at | [date-time](/#datetime-filter-operators) |

          | id | [int64](/#numeric-filter-operators) |

          | updated_at | [date-time](/#datetime-filter-operators) |

          '
        schema:
          type: array
          items:
            type: string
    post:
      tags:
      - Treatment Note Template
      summary: Create treatment note template
      operationId: CreateTreatmentNoteTemplate-Post
      responses:
        '201':
          description: Resource was created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TreatmentNoteTemplate'
        '422':
          $ref: '#/components/responses/ValidationError'
      requestBody:
        $ref: '#/components/requestBodies/TreatmentNoteTemplate'
    servers:
    - url: https://api.au1.cliniko.com/v1
      description: Production
  /treatment_note_templates/{id}:
    get:
      tags:
      - Treatment Note Template
      summary: Get treatment note template
      operationId: GetTreatmentNoteTemplate-Get
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TreatmentNoteTemplate'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: int64
      - in: query
        name: q[]
        description: 'Filter result by one or more fields.


          See [Filtering Results](/#filtering-results)


          Available filters:


          | Value | Format |

          |---|---|

          | archived_at | [date-time](/#datetime-filter-operators) |

          | deleted_at | [date-time](/#datetime-filter-operators) |

          '
        schema:
          type: array
          items:
            type: string
    patch:
      tags:
      - Treatment Note Template
      summary: Update treatment note template
      operationId: UpdateTreatmentNoteTemplate-Patch
      responses:
        '200':
          description: Resource was updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TreatmentNoteTemplate'
        '422':
          $ref: '#/components/responses/ValidationError'
      requestBody:
        $ref: '#/components/requestBodies/TreatmentNoteTemplate'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: int64
    delete:
      tags:
      - Treatment Note Template
      summary: Archive treatment note template
      operationId: DeleteTreatmentNoteTemplate-Delete
      responses:
        '204':
          description: Resource was archived successfully
      deprecated: true
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: int64
    servers:
    - url: https://api.au1.cliniko.com/v1
      description: Production
  /treatment_note_templates/{id}/archive:
    post:
      tags:
      - Treatment Note Template
      summary: Archive treatment note template
      operationId: ArchiveTreatmentNoteTemplate-Post
      responses:
        '204':
          description: Resource was archived
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: int64
    servers:
    - url: https://api.au1.cliniko.com/v1
      description: Production
components:
  schemas:
    TreatmentNoteTemplateQuestionCheckboxes:
      type: object
      properties:
        answers:
          type: array
          items:
            type: object
            properties:
              value:
                type:
                - string
                - 'null'
                maxLength: 255
        other:
          type: object
          properties:
            enabled:
              type: boolean
        name:
          type: string
          maxLength: 255
        type:
          type:
          - string
          - 'null'
          enum:
          - checkboxes
      required:
      - name
      - type
      title: Checkboxes
    TreatmentNoteTemplateQuestionText:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        type:
          type:
          - string
          - 'null'
          enum:
          - text
      required:
      - name
      - type
      title: Text
    TreatmentNoteTemplateQuestionParagraph:
      type: object
      properties:
        answer:
          type: string
        name:
          type: string
          maxLength: 255
        type:
          type:
          - string
          - 'null'
          enum:
          - paragraph
      required:
      - name
      - type
      title: Paragraph
    TreatmentNoteTemplateQuestionBodycharts:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        type:
          type:
          - string
          - 'null'
          enum:
          - bodycharts
      required:
      - name
      - type
      title: Bodycharts
    TreatmentNoteTemplateQuestionDate:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        type:
          type:
          - string
          - 'null'
          enum:
          - date
      required:
      - name
      - type
      title: Date
    TreatmentNoteTemplate:
      type: object
      properties:
        archived_at:
          type:
          - string
          - 'null'
          format: date-time
        content:
          type: object
          properties:
            sections:
              type: array
              items:
                type: object
                properties:
                  name:
                    type:
                    - string
                    - 'null'
                    maxLength: 255
                  description:
                    type:
                    - string
                    - 'null'
                  questions:
                    type: array
                    items:
                      oneOf:
                      - $ref: '#/components/schemas/TreatmentNoteTemplateQuestionText'
                      - $ref: '#/components/schemas/TreatmentNoteTemplateQuestionParagraph'
                      - $ref: '#/components/schemas/TreatmentNoteTemplateQuestionDate'
                      - $ref: '#/components/schemas/TreatmentNoteTemplateQuestionBodycharts'
                      - $ref: '#/components/schemas/TreatmentNoteTemplateQuestionCheckboxes'
                      - $ref: '#/components/schemas/TreatmentNoteTemplateQuestionRadiobuttons'
        created_at:
          type: string
          format: date-time
        deleted_at:
          type:
          - string
          - 'null'
          format: date-time
        id:
          type: string
          format: int64
        links:
          type: object
          properties:
            self:
              type: string
              format: uri
              example: https://api.au1.cliniko.com/v1/treatment_note_templates/1
        name:
          type: string
          maxLength: 255
        print_settings:
          type:
          - object
          - 'null'
          properties:
            include_patient_address:
              type:
              - boolean
              - 'null'
            include_patient_dob:
              type:
              - boolean
              - 'null'
            include_patient_medicare:
              type:
              - boolean
              - 'null'
            include_patient_occupation:
              type:
              - boolean
              - 'null'
            include_patient_reference_number:
              type:
              - boolean
              - 'null'
            title:
              type:
              - string
              - 'null'
        updated_at:
          type: string
          format: date-time
      x-tags:
      - Treatment Note Template
    TreatmentNoteTemplateQuestionRadiobuttons:
      type: object
      properties:
        answers:
          type: array
          items:
            type: object
            properties:
              value:
                type:
                - string
                - 'null'
                maxLength: 255
        other:
          type: object
          properties:
            enabled:
              type: boolean
        name:
          type: string
          maxLength: 255
        type:
          type:
          - string
          - 'null'
          enum:
          - radiobuttons
      required:
      - name
      - type
      title: Radiobuttons
  parameters:
    Sort:
      in: query
      name: sort
      explode: false
      description: 'Comma separated search fields. See: [Ordering](/#ordering)'
      schema:
        type: array
        items:
          type: string
          example: created_at:desc
    Order:
      in: query
      name: order
      deprecated: true
      schema:
        type: string
        enum:
        - asc
        - desc
    Page:
      in: query
      name: page
      schema:
        type: integer
        minimum: 1
    PerPage:
      in: query
      name: per_page
      schema:
        type: integer
        minimum: 1
        maximum: 100
  requestBodies:
    TreatmentNoteTemplate:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              content:
                type: object
                properties:
                  sections:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type:
                          - string
                          - 'null'
                          maxLength: 255
                        description:
                          type:
                          - string
                          - 'null'
                        questions:
                          type: array
                          items:
                            oneOf:
                            - $ref: '#/components/schemas/TreatmentNoteTemplateQuestionText'
                            - $ref: '#/components/schemas/TreatmentNoteTemplateQuestionParagraph'
                            - $ref: '#/components/schemas/TreatmentNoteTemplateQuestionDate'
                            - $ref: '#/components/schemas/TreatmentNoteTemplateQuestionBodycharts'
                            - $ref: '#/components/schemas/TreatmentNoteTemplateQuestionCheckboxes'
                            - $ref: '#/components/schemas/TreatmentNoteTemplateQuestionRadiobuttons'
              name:
                type: string
                maxLength: 255
              print_settings:
                type: object
                properties:
                  include_patient_address:
                    type: boolean
                  include_patient_dob:
                    type: boolean
                  include_patient_medicare:
                    type: boolean
                  include_patient_occupation:
                    type: boolean
                  include_patient_reference_number:
                    type: boolean
                  title:
                    type: string
  responses:
    ValidationError:
      description: Resource could not be saved due to validation errors
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Validation Failed
              errors:
                type: object
                additionalProperties:
                  type: string
                  x-additionalPropertiesName: error field
                example:
                  api_field: error message
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
externalDocs:
  description: Clinko API Developers Group
