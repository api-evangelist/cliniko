openapi: 3.2.0
info:
  title: Cliniko Billable Item API
  version: v1
  description: 'Operations tagged Billable Item across 2 of this provider''s published API definitions: cliniko-openapi.yml, cliniko-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.au1.cliniko.com/v1
  description: Production
security:
- basicAuth: []
tags:
- name: Billable Item
paths:
  /billable_items:
    get:
      tags:
      - Billable Item
      summary: List billable items
      operationId: ListBillableItems-Get
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  billable_items:
                    type: array
                    items:
                      $ref: '#/components/schemas/BillableItem'
                  total_entries:
                    type: integer
                    example: 1
                  links:
                    type: object
                    properties:
                      self:
                        type: string
                        format: uri
                        example: https://api.au1.cliniko.com/v1/billable_items?page=2
                      previous:
                        type: string
                        format: uri
                        example: https://api.au1.cliniko.com/v1/billable_items?page=1
                      next:
                        type: string
                        format: uri
                        example: https://api.au1.cliniko.com/v1/billable_items?page=3
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/Order'
      - in: query
        name: q[]
        description: 'Filter result by one or more fields.


          See [Filtering Results](/#filtering-results)


          Available filters:


          | Value | Format |

          |---|---|

          | archived_at | [date-time](/#datetime-filter-operators) |

          | created_at | [date-time](/#datetime-filter-operators) |

          | id | [int64](/#numeric-filter-operators) |

          | tax_id | [int64](/#numeric-filter-operators) |

          | updated_at | [date-time](/#datetime-filter-operators) |

          '
        schema:
          type: array
          items:
            type: string
    post:
      tags:
      - Billable Item
      summary: Create billable item
      operationId: CreateBillableItem-Post
      responses:
        '201':
          description: Resource was created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillableItem'
        '422':
          $ref: '#/components/responses/ValidationError'
      requestBody:
        $ref: '#/components/requestBodies/BillableItem'
    servers:
    - url: https://api.au1.cliniko.com/v1
      description: Production
  /billable_items/{id}:
    get:
      tags:
      - Billable Item
      summary: Get billable item
      operationId: GetBillableItem-Get
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillableItem'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: int64
      - in: query
        name: q[]
        description: 'Filter result by one or more fields.


          See [Filtering Results](/#filtering-results)


          Available filters:


          | Value | Format |

          |---|---|

          | archived_at | [date-time](/#datetime-filter-operators) |

          '
        schema:
          type: array
          items:
            type: string
    patch:
      tags:
      - Billable Item
      summary: Update billable item
      operationId: UpdateBillableItem-Patch
      responses:
        '200':
          description: Resource was updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillableItem'
        '422':
          $ref: '#/components/responses/ValidationError'
      requestBody:
        $ref: '#/components/requestBodies/BillableItem'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: int64
    delete:
      tags:
      - Billable Item
      summary: Archive billable item
      operationId: DeleteBillableItem-Delete
      responses:
        '204':
          description: Resource was archived successfully
      deprecated: true
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: int64
    servers:
    - url: https://api.au1.cliniko.com/v1
      description: Production
  /billable_items/{id}/archive:
    post:
      tags:
      - Billable Item
      summary: Archive billable item
      operationId: ArchiveBillableItem-Post
      responses:
        '204':
          description: Resource was archived
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: int64
    servers:
    - url: https://api.au1.cliniko.com/v1
      description: Production
components:
  schemas:
    BillableItem:
      type: object
      properties:
        archived_at:
          type:
          - string
          - 'null'
          format: date-time
        concession_prices:
          deprecated: false
          type: object
          properties:
            links:
              type: object
              properties:
                self:
                  type: string
                  format: uri
                  example: https://api.au1.cliniko.com/v1/concession_prices?q%5B%5D=billable_item_id%3A%3D1
        created_at:
          type: string
          format: date-time
        id:
          type: string
          format: int64
        item_code:
          type:
          - string
          - 'null'
          maxLength: 100
        item_type:
          enum:
          - Product
          - Service
          - Other
          type: string
        links:
          type: object
          properties:
            self:
              type: string
              format: uri
              example: https://api.au1.cliniko.com/v1/billable_items/1
        name:
          type: string
          maxLength: 255
        price:
          type: string
          format: decimal
          minimum: -4000000000
          exclusiveMaximum: 4000000000
        tax:
          deprecated: false
          type: object
          properties:
            links:
              type: object
              properties:
                self:
                  type: string
                  format: uri
                  example: https://api.au1.cliniko.com/v1/taxes/1
        updated_at:
          type: string
          format: date-time
      x-tags:
      - Billable Item
  requestBodies:
    BillableItem:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              item_code:
                type:
                - string
                - 'null'
                maxLength: 100
              item_type:
                enum:
                - Product
                - Service
                - Other
                type: string
              name:
                type: string
                maxLength: 255
              price:
                type: string
                format: decimal
                minimum: -4000000000
                exclusiveMaximum: 4000000000
              tax_id:
                type: string
                format: int64
                description: tax id
                example: '1'
  parameters:
    Order:
      in: query
      name: order
      deprecated: true
      schema:
        type: string
        enum:
        - asc
        - desc
    Sort:
      in: query
      name: sort
      explode: false
      description: 'Comma separated search fields. See: [Ordering](/#ordering)'
      schema:
        type: array
        items:
          type: string
          example: created_at:desc
    Page:
      in: query
      name: page
      schema:
        type: integer
        minimum: 1
    PerPage:
      in: query
      name: per_page
      schema:
        type: integer
        minimum: 1
        maximum: 100
  responses:
    ValidationError:
      description: Resource could not be saved due to validation errors
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Validation Failed
              errors:
                type: object
                additionalProperties:
                  type: string
                  x-additionalPropertiesName: error field
                example:
                  api_field: error message
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
externalDocs:
  description: Clinko API Developers Group
  url: https://groups.google.com/a/redguava.com.au/d/forum/cliniko-api
x-refined-from:
- cliniko-openapi.yml
- cliniko-openapi.yml
