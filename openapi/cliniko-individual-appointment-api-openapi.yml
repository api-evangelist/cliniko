openapi: 3.2.0
info:
  title: Cliniko Individual Appointment API
  version: v1
  description: 'Operations tagged Individual Appointment across 2 of this provider''s published API definitions: cliniko-openapi.yml, cliniko-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.au1.cliniko.com/v1
  description: Production
security:
- basicAuth: []
tags:
- name: Individual Appointment
paths:
  /individual_appointments:
    get:
      tags:
      - Individual Appointment
      summary: List individual appointments
      operationId: ListIndividualAppointments-Get
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  individual_appointments:
                    type: array
                    items:
                      $ref: '#/components/schemas/IndividualAppointment'
                  total_entries:
                    type: integer
                    example: 1
                  links:
                    type: object
                    properties:
                      self:
                        type: string
                        format: uri
                        example: https://api.au1.cliniko.com/v1/individual_appointments?page=2
                      previous:
                        type: string
                        format: uri
                        example: https://api.au1.cliniko.com/v1/individual_appointments?page=1
                      next:
                        type: string
                        format: uri
                        example: https://api.au1.cliniko.com/v1/individual_appointments?page=3
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/Order'
      - in: query
        name: q[]
        description: 'Filter result by one or more fields.


          See [Filtering Results](/#filtering-results)


          Available filters:


          | Value | Format |

          |---|---|

          | appointment_type_id | [int64](/#numeric-filter-operators) |

          | archived_at | [date-time](/#datetime-filter-operators) |

          | business_id | [int64](/#numeric-filter-operators) |

          | cancelled_at | [date-time](/#datetime-filter-operators) |

          | created_at | [date-time](/#datetime-filter-operators) |

          | deleted_at | [date-time](/#datetime-filter-operators) |

          | did_not_arrive | [boolean](/#boolean-filter-operators) |

          | ends_at | [date-time](/#datetime-filter-operators) |

          | id | [int64](/#numeric-filter-operators) |

          | patient_id | [int64](/#numeric-filter-operators) |

          | practitioner_id | [int64](/#numeric-filter-operators) |

          | repeated_from_id | [int64](/#numeric-filter-operators) |

          | starts_at | [date-time](/#datetime-filter-operators) |

          | updated_at | [date-time](/#datetime-filter-operators) |

          '
        schema:
          type: array
          items:
            type: string
    post:
      tags:
      - Individual Appointment
      summary: Create individual appointment
      operationId: CreateIndividualAppointment-Post
      responses:
        '201':
          description: Resource was created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndividualAppointment'
        '422':
          $ref: '#/components/responses/ValidationError'
      requestBody:
        $ref: '#/components/requestBodies/IndividualAppointment'
    servers:
    - url: https://api.au1.cliniko.com/v1
      description: Production
  /individual_appointments/{id}:
    get:
      tags:
      - Individual Appointment
      summary: Get individual appointment
      operationId: GetIndividualAppointment-Get
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndividualAppointment'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: int64
      - in: query
        name: q[]
        description: 'Filter result by one or more fields.


          See [Filtering Results](/#filtering-results)


          Available filters:


          | Value | Format |

          |---|---|

          | archived_at | [date-time](/#datetime-filter-operators) |

          | cancelled_at | [date-time](/#datetime-filter-operators) |

          | deleted_at | [date-time](/#datetime-filter-operators) |

          '
        schema:
          type: array
          items:
            type: string
    patch:
      tags:
      - Individual Appointment
      summary: Update individual appointment
      operationId: UpdateIndividualAppointment-Patch
      responses:
        '200':
          description: Resource was updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndividualAppointment'
        '422':
          $ref: '#/components/responses/ValidationError'
      requestBody:
        $ref: '#/components/requestBodies/IndividualAppointment'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: int64
    delete:
      tags:
      - Individual Appointment
      summary: Archive individual appointment
      operationId: DeleteIndividualAppointment-Delete
      responses:
        '204':
          description: Resource was archived successfully
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: int64
      deprecated: true
    servers:
    - url: https://api.au1.cliniko.com/v1
      description: Production
  /individual_appointments/{id}/archive:
    post:
      tags:
      - Individual Appointment
      summary: Archive individual appointment
      operationId: ArchiveIndividualAppointment-Post
      responses:
        '204':
          description: Resource was archived
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: int64
    servers:
    - url: https://api.au1.cliniko.com/v1
      description: Production
  /individual_appointments/{id}/cancel:
    patch:
      tags:
      - Individual Appointment
      summary: Cancel individual appointment
      operationId: CancelIndividualAppointment-Patch
      responses:
        '204':
          description: Resource was cancelled
      requestBody:
        $ref: '#/components/requestBodies/IndividualAppointmentCancel'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: int64
    servers:
    - url: https://api.au1.cliniko.com/v1
      description: Production
  /individual_appointments/{id}/conflicts:
    get:
      tags:
      - Individual Appointment
      summary: Get conflicts for an individual appointment
      operationId: GetIndividualAppointmentConflicts-Get
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  conflicts:
                    type: object
                    properties:
                      exist:
                        type: boolean
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: int64
    servers:
    - url: https://api.au1.cliniko.com/v1
      description: Production
components:
  requestBodies:
    IndividualAppointmentCancel:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              cancellation_note:
                type:
                - string
                - 'null'
              cancellation_reason:
                type: integer
                description: '| Enum Value | Description |

                  |---|---|

                  |10|Feeling better|

                  |20|Condition worse|

                  |30|Sick|

                  |40|Away|

                  |50|Other|

                  |60|Work|

                  '
                enum:
                - 10
                - 20
                - 30
                - 40
                - 50
                - 60
              apply_to_repeats:
                type: boolean
    IndividualAppointment:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              appointment_type_id:
                type: string
                format: int64
                description: appointment type id
                example: '1'
              business_id:
                type: string
                format: int64
                description: business id
                example: '1'
              ends_at:
                type: string
                format: date-time
                description: If not provided on create or set to null on update, this will be based on the duration of the appointment type.
              notes:
                type:
                - string
                - 'null'
              patient_id:
                type: string
                format: int64
                description: patient id
                example: '1'
              patient_case_id:
                type: string
                format: int64
                description: patient case id
                example: '1'
              practitioner_id:
                type: string
                format: int64
                description: practitioner id
                example: '1'
              starts_at:
                type: string
                format: date-time
              repeat_rule:
                type:
                - object
                - 'null'
                properties:
                  number_of_repeats:
                    type:
                    - integer
                    - 'null'
                    exclusiveMinimum: 0
                  repeat_type:
                    type:
                    - string
                    - 'null'
                    enum:
                    - Daily
                    - Monthly
                    - Weekly
                  repeating_interval:
                    type:
                    - integer
                    - 'null'
                    maximum: 100
                    exclusiveMinimum: 0
  parameters:
    Sort:
      in: query
      name: sort
      explode: false
      description: 'Comma separated search fields. See: [Ordering](/#ordering)'
      schema:
        type: array
        items:
          type: string
          example: created_at:desc
    Order:
      in: query
      name: order
      deprecated: true
      schema:
        type: string
        enum:
        - asc
        - desc
    PerPage:
      in: query
      name: per_page
      schema:
        type: integer
        minimum: 1
        maximum: 100
    Page:
      in: query
      name: page
      schema:
        type: integer
        minimum: 1
  responses:
    ValidationError:
      description: Resource could not be saved due to validation errors
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Validation Failed
              errors:
                type: object
                additionalProperties:
                  type: string
                  x-additionalPropertiesName: error field
                example:
                  api_field: error message
  schemas:
    IndividualAppointment:
      type: object
      properties:
        appointment_type:
          deprecated: false
          type: object
          properties:
            links:
              type: object
              properties:
                self:
                  type: string
                  format: uri
                  example: https://api.au1.cliniko.com/v1/appointment_types/1
        archived_at:
          type:
          - string
          - 'null'
          format: date-time
        attendees:
          deprecated: false
          type: object
          properties:
            links:
              type: object
              properties:
                self:
                  type: string
                  format: uri
                  example: https://api.au1.cliniko.com/v1/individual_appointments/1/attendees
        booking_ip_address:
          type:
          - string
          - 'null'
          format: ipv4
          example: 10.0.0.43
        business:
          deprecated: false
          type: object
          properties:
            links:
              type: object
              properties:
                self:
                  type: string
                  format: uri
                  example: https://api.au1.cliniko.com/v1/businesses/1
        cancellation_note:
          type:
          - string
          - 'null'
        cancellation_reason:
          type:
          - integer
          - 'null'
        cancellation_reason_description:
          type:
          - string
          - 'null'
          enum:
          - Feeling Better
          - Condition Worse
          - Sick
          - COVID-19 related
          - Away
          - Other
          - Work
        cancelled_at:
          type:
          - string
          - 'null'
          format: date-time
        conflicts:
          type:
          - object
          - 'null'
          properties:
            links:
              properties:
                self:
                  example: https://api.au1.cliniko.com/v1/individual_appointments/1/conflicts
                  format: uri
                  type: string
              type: object
        created_at:
          type: string
          format: date-time
        deleted_at:
          type:
          - string
          - 'null'
          format: date-time
        did_not_arrive:
          type:
          - boolean
          - 'null'
        email_reminder_sent:
          type:
          - boolean
          - 'null'
        ends_at:
          type: string
          format: date-time
        has_patient_appointment_notes:
          type:
          - boolean
          - 'null'
        id:
          type: string
          format: int64
        invoice_status:
          type:
          - integer
          - 'null'
        links:
          type: object
          properties:
            self:
              type: string
              format: uri
              example: https://api.au1.cliniko.com/v1/individual_appointments/1
        notes:
          type:
          - string
          - 'null'
        online_booking_policy_accepted:
          type:
          - boolean
          - 'null'
        patient:
          deprecated: false
          type: object
          properties:
            links:
              type: object
              properties:
                self:
                  type: string
                  format: uri
                  example: https://api.au1.cliniko.com/v1/patients/1
        patient_arrived:
          type:
          - boolean
          - 'null'
        patient_case:
          deprecated: false
          type: object
          properties:
            links:
              type: object
              properties:
                self:
                  type: string
                  format: uri
                  example: https://api.au1.cliniko.com/v1/patient_cases/1
        patient_name:
          type:
          - string
          - 'null'
        practitioner:
          deprecated: false
          type: object
          properties:
            links:
              type: object
              properties:
                self:
                  type: string
                  format: uri
                  example: https://api.au1.cliniko.com/v1/practitioners/1
        repeat_rule:
          type:
          - object
          - 'null'
          properties:
            number_of_repeats:
              type:
              - integer
              - 'null'
              exclusiveMinimum: 0
            repeat_type:
              type:
              - string
              - 'null'
              enum:
              - Daily
              - Monthly
              - Weekly
            repeating_interval:
              type:
              - integer
              - 'null'
              maximum: 100
              exclusiveMinimum: 0
        repeated_from:
          deprecated: false
          type: object
          properties:
            links:
              type: object
              properties:
                self:
                  type: string
                  format: uri
                  example: https://api.au1.cliniko.com/v1/individual_appointments/1
        repeats:
          type:
          - object
          - 'null'
          properties:
            links:
              properties:
                self:
                  example: https://api.au1.cliniko.com/v1/individual_appointments?q[]=repeated_from_id:=1
                  format: uri
                  type: string
              type: object
        sms_reminder_sent:
          type:
          - boolean
          - 'null'
        starts_at:
          type: string
          format: date-time
        telehealth_url:
          type:
          - string
          - 'null'
          format: uri
        treatment_note_status:
          type:
          - integer
          - 'null'
        updated_at:
          type: string
          format: date-time
      x-tags:
      - Individual Appointment
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
externalDocs:
  description: Clinko API Developers Group
  url: https://groups.google.com/a/redguava.com.au/d/forum/cliniko-api
x-refined-from:
- cliniko-openapi.yml
- cliniko-openapi.yml
