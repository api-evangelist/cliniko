openapi: 3.2.0
info:
  title: Cliniko Recall API
  version: v1
  description: 'Operations tagged Recall across 2 of this provider''s published API definitions: cliniko-openapi.yml, cliniko-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.au1.cliniko.com/v1
  description: Production
security:
- basicAuth: []
tags:
- name: Recall
paths:
  /recalls:
    get:
      tags:
      - Recall
      summary: List recalls
      operationId: ListRecalls-Get
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  recalls:
                    type: array
                    items:
                      $ref: '#/components/schemas/Recall'
                  total_entries:
                    type: integer
                    example: 1
                  links:
                    type: object
                    properties:
                      self:
                        type: string
                        format: uri
                        example: https://api.au1.cliniko.com/v1/recalls?page=2
                      previous:
                        type: string
                        format: uri
                        example: https://api.au1.cliniko.com/v1/recalls?page=1
                      next:
                        type: string
                        format: uri
                        example: https://api.au1.cliniko.com/v1/recalls?page=3
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/Order'
      - in: query
        name: q[]
        description: 'Filter result by one or more fields.


          See [Filtering Results](/#filtering-results)


          Available filters:


          | Value | Format |

          |---|---|

          | archived_at | [date-time](/#datetime-filter-operators) |

          | created_at | [date-time](/#datetime-filter-operators) |

          | id | [int64](/#numeric-filter-operators) |

          | patient_id | [int64](/#numeric-filter-operators) |

          | recalled_at | [date-time](/#datetime-filter-operators) |

          | updated_at | [date-time](/#datetime-filter-operators) |

          '
        schema:
          type: array
          items:
            type: string
    post:
      tags:
      - Recall
      summary: Create recall
      operationId: CreateRecall-Post
      responses:
        '201':
          description: Resource was created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recall'
        '422':
          $ref: '#/components/responses/ValidationError'
      requestBody:
        $ref: '#/components/requestBodies/Recall'
    servers:
    - url: https://api.au1.cliniko.com/v1
      description: Production
  /recalls/{id}:
    get:
      tags:
      - Recall
      summary: Get recall
      operationId: GetRecall-Get
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recall'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: int64
      - in: query
        name: q[]
        description: 'Filter result by one or more fields.


          See [Filtering Results](/#filtering-results)


          Available filters:


          | Value | Format |

          |---|---|

          | archived_at | [date-time](/#datetime-filter-operators) |

          '
        schema:
          type: array
          items:
            type: string
    patch:
      tags:
      - Recall
      summary: Update recall
      operationId: UpdateRecall-Patch
      responses:
        '200':
          description: Resource was updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recall'
        '422':
          $ref: '#/components/responses/ValidationError'
      requestBody:
        $ref: '#/components/requestBodies/Recall'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: int64
    servers:
    - url: https://api.au1.cliniko.com/v1
      description: Production
  /recalls/{id}/archive:
    post:
      tags:
      - Recall
      summary: Archive recall
      operationId: ArchiveRecall-Post
      responses:
        '204':
          description: Resource was archived
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: int64
    servers:
    - url: https://api.au1.cliniko.com/v1
      description: Production
components:
  schemas:
    Recall:
      type: object
      properties:
        archived_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
        id:
          type: string
          format: int64
        links:
          type: object
          properties:
            self:
              type: string
              format: uri
              example: https://api.au1.cliniko.com/v1/recalls/1
        notes:
          type:
          - string
          - 'null'
        patient:
          deprecated: false
          type: object
          properties:
            links:
              type: object
              properties:
                self:
                  type: string
                  format: uri
                  example: https://api.au1.cliniko.com/v1/patients/1
        recall_at:
          type: string
          format: date
        recall_type:
          deprecated: false
          type: object
          properties:
            links:
              type: object
              properties:
                self:
                  type: string
                  format: uri
                  example: https://api.au1.cliniko.com/v1/recall_types/1
        recalled:
          type:
          - boolean
          - 'null'
        recalled_at:
          type:
          - string
          - 'null'
          format: date-time
        recalled_by_user:
          deprecated: false
          type: object
          properties:
            links:
              type: object
              properties:
                self:
                  type: string
                  format: uri
                  example: https://api.au1.cliniko.com/v1/users/1
        updated_at:
          type: string
          format: date-time
      x-tags:
      - Recall
  parameters:
    Sort:
      in: query
      name: sort
      explode: false
      description: 'Comma separated search fields. See: [Ordering](/#ordering)'
      schema:
        type: array
        items:
          type: string
          example: created_at:desc
    Order:
      in: query
      name: order
      deprecated: true
      schema:
        type: string
        enum:
        - asc
        - desc
    Page:
      in: query
      name: page
      schema:
        type: integer
        minimum: 1
    PerPage:
      in: query
      name: per_page
      schema:
        type: integer
        minimum: 1
        maximum: 100
  responses:
    ValidationError:
      description: Resource could not be saved due to validation errors
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Validation Failed
              errors:
                type: object
                additionalProperties:
                  type: string
                  x-additionalPropertiesName: error field
                example:
                  api_field: error message
  requestBodies:
    Recall:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              notes:
                type:
                - string
                - 'null'
              patient_id:
                type: string
                format: int64
                description: patient id
                example: '1'
              recall_at:
                type: string
                format: date
              recall_type_id:
                type: string
                format: int64
                description: recall type id
                example: '1'
              recalled:
                type:
                - boolean
                - 'null'
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
externalDocs:
  description: Clinko API Developers Group
  url: https://groups.google.com/a/redguava.com.au/d/forum/cliniko-api
x-refined-from:
- cliniko-openapi.yml
- cliniko-openapi.yml
