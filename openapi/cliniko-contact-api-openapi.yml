openapi: 3.2.0
info:
  title: Cliniko Contact API
  version: v1
  description: 'Operations tagged Contact across 2 of this provider''s published API definitions: cliniko-openapi.yml, cliniko-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.au1.cliniko.com/v1
  description: Production
security:
- basicAuth: []
tags:
- name: Contact
paths:
  /contacts:
    get:
      tags:
      - Contact
      summary: List contacts
      operationId: ListContacts-Get
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  contacts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Contact'
                  total_entries:
                    type: integer
                    example: 1
                  links:
                    type: object
                    properties:
                      self:
                        type: string
                        format: uri
                        example: https://api.au1.cliniko.com/v1/contacts?page=2
                      previous:
                        type: string
                        format: uri
                        example: https://api.au1.cliniko.com/v1/contacts?page=1
                      next:
                        type: string
                        format: uri
                        example: https://api.au1.cliniko.com/v1/contacts?page=3
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/Order'
      - in: query
        name: q[]
        description: 'Filter result by one or more fields.


          See [Filtering Results](/#filtering-results)


          Available filters:


          | Value | Format |

          |---|---|

          | archived_at | [date-time](/#datetime-filter-operators) |

          | company_name | [string](/#string-filter-operators) |

          | created_at | [date-time](/#datetime-filter-operators) |

          | deleted_at | [date-time](/#datetime-filter-operators) |

          | email | [string](/#string-filter-operators) |

          | first_name | [string](/#string-filter-operators) |

          | id | [int64](/#numeric-filter-operators) |

          | last_name | [string](/#string-filter-operators) |

          | occupation | [string](/#string-filter-operators) |

          | type_code | [integer](/#numeric-filter-operators) |

          | updated_at | [date-time](/#datetime-filter-operators) |

          '
        schema:
          type: array
          items:
            type: string
    post:
      tags:
      - Contact
      summary: Create contact
      operationId: CreateContact-Post
      responses:
        '201':
          description: Resource was created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '422':
          $ref: '#/components/responses/ValidationError'
      requestBody:
        $ref: '#/components/requestBodies/Contact'
    servers:
    - url: https://api.au1.cliniko.com/v1
      description: Production
  /contacts/{id}:
    get:
      tags:
      - Contact
      summary: Get contact
      operationId: GetContact-Get
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: int64
      - in: query
        name: q[]
        description: 'Filter result by one or more fields.


          See [Filtering Results](/#filtering-results)


          Available filters:


          | Value | Format |

          |---|---|

          | archived_at | [date-time](/#datetime-filter-operators) |

          | deleted_at | [date-time](/#datetime-filter-operators) |

          '
        schema:
          type: array
          items:
            type: string
    patch:
      tags:
      - Contact
      summary: Update contact
      operationId: UpdateContact-Patch
      responses:
        '200':
          description: Resource was updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '422':
          $ref: '#/components/responses/ValidationError'
      requestBody:
        $ref: '#/components/requestBodies/Contact'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: int64
    delete:
      tags:
      - Contact
      summary: Archive contact
      operationId: DeleteContact-Delete
      responses:
        '204':
          description: Resource was archived successfully
      deprecated: true
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: int64
    servers:
    - url: https://api.au1.cliniko.com/v1
      description: Production
  /contacts/{id}/archive:
    post:
      tags:
      - Contact
      summary: Archive contact
      operationId: ArchiveContact-Post
      responses:
        '204':
          description: Resource was archived
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: int64
    servers:
    - url: https://api.au1.cliniko.com/v1
      description: Production
components:
  responses:
    ValidationError:
      description: Resource could not be saved due to validation errors
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Validation Failed
              errors:
                type: object
                additionalProperties:
                  type: string
                  x-additionalPropertiesName: error field
                example:
                  api_field: error message
  parameters:
    Sort:
      in: query
      name: sort
      explode: false
      description: 'Comma separated search fields. See: [Ordering](/#ordering)'
      schema:
        type: array
        items:
          type: string
          example: created_at:desc
    Order:
      in: query
      name: order
      deprecated: true
      schema:
        type: string
        enum:
        - asc
        - desc
    Page:
      in: query
      name: page
      schema:
        type: integer
        minimum: 1
    PerPage:
      in: query
      name: per_page
      schema:
        type: integer
        minimum: 1
        maximum: 100
  requestBodies:
    Contact:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              address_1:
                type:
                - string
                - 'null'
                maxLength: 255
              address_2:
                type:
                - string
                - 'null'
                maxLength: 255
              address_3:
                type:
                - string
                - 'null'
                maxLength: 255
              city:
                type:
                - string
                - 'null'
                maxLength: 255
              company_name:
                type:
                - string
                - 'null'
                maxLength: 255
              country_code:
                type:
                - string
                - 'null'
                description: '[ISO 3166-1](https://en.wikipedia.org/wiki/ISO_3166-1#Current_codes) country code'
                example: AU
                maxLength: 2
              doctor_type:
                type:
                - string
                - 'null'
                enum:
                - general_practitioner
                - specialist
              email:
                type:
                - string
                - 'null'
                maxLength: 255
              first_name:
                type:
                - string
                - 'null'
                maxLength: 255
              last_name:
                type:
                - string
                - 'null'
                maxLength: 255
              notes:
                type:
                - string
                - 'null'
              occupation:
                type:
                - string
                - 'null'
                maxLength: 255
              post_code:
                type:
                - string
                - 'null'
                maxLength: 255
              preferred_name:
                type:
                - string
                - 'null'
              provider_number:
                type:
                - string
                - 'null'
                maxLength: 255
              state:
                type:
                - string
                - 'null'
                maxLength: 255
              title:
                type:
                - string
                - 'null'
              type_code:
                type: integer
                enum:
                - 0
                - 1
                - 2
              phone_numbers:
                type: array
                items:
                  type: object
                  properties:
                    phone_type:
                      enum:
                      - Mobile
                      - Home
                      - Work
                      - Other
                      - Fax
                      type: string
                    number:
                      type: string
                      format: phone
                      example: 0-123-456-78
  schemas:
    Contact:
      type: object
      properties:
        address_1:
          type:
          - string
          - 'null'
          maxLength: 255
        address_2:
          type:
          - string
          - 'null'
          maxLength: 255
        address_3:
          type:
          - string
          - 'null'
          maxLength: 255
        archived_at:
          type:
          - string
          - 'null'
          format: date-time
        city:
          type:
          - string
          - 'null'
          maxLength: 255
        company_name:
          type:
          - string
          - 'null'
          maxLength: 255
        country:
          type:
          - string
          - 'null'
        country_code:
          type:
          - string
          - 'null'
          description: '[ISO 3166-1](https://en.wikipedia.org/wiki/ISO_3166-1#Current_codes) country code'
          example: AU
          maxLength: 2
        created_at:
          type: string
          format: date-time
        deleted_at:
          type:
          - string
          - 'null'
          format: date-time
        doctor_type:
          type:
          - string
          - 'null'
          enum:
          - general_practitioner
          - specialist
        email:
          type:
          - string
          - 'null'
          maxLength: 255
        first_name:
          type:
          - string
          - 'null'
          maxLength: 255
        id:
          type: string
          format: int64
        last_name:
          type:
          - string
          - 'null'
          maxLength: 255
        links:
          type: object
          properties:
            self:
              type: string
              format: uri
              example: https://api.au1.cliniko.com/v1/contacts/1
        notes:
          type:
          - string
          - 'null'
        occupation:
          type:
          - string
          - 'null'
          maxLength: 255
        phone_numbers:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/PhoneNumber'
        post_code:
          type:
          - string
          - 'null'
          maxLength: 255
        preferred_name:
          type:
          - string
          - 'null'
        provider_number:
          type:
          - string
          - 'null'
          maxLength: 255
        state:
          type:
          - string
          - 'null'
          maxLength: 255
        title:
          type:
          - string
          - 'null'
        type:
          type:
          - string
          - 'null'
          enum:
          - Doctor
          - 3rd Party Payer
          - Standard
        type_code:
          type: integer
          enum:
          - 0
          - 1
          - 2
        updated_at:
          type: string
          format: date-time
      x-tags:
      - Contact
    PhoneNumber:
      type: object
      properties:
        normalized_number:
          type: string
          format: phone
          example: '39012345678'
        number:
          type: string
          format: phone
          example: 0-123-456-78
        phone_type:
          type: string
          enum:
          - Fax
          - Home
          - Mobile
          - Other
          - Work
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
externalDocs:
  description: Clinko API Developers Group
  url: https://groups.google.com/a/redguava.com.au/d/forum/cliniko-api
x-refined-from:
- cliniko-openapi.yml
- cliniko-openapi.yml
