openapi: 3.2.0
info:
  title: Cliniko Body Chart API
  version: v1
  description: 'Operations tagged Body Chart across 2 of this provider''s published API definitions: cliniko-openapi.yml, cliniko-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.au1.cliniko.com/v1
  description: Production
security:
- basicAuth: []
tags:
- name: Body Chart
paths:
  /body_charts:
    get:
      tags:
      - Body Chart
      summary: List body charts
      operationId: ListBodyCharts-Get
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  body_charts:
                    type: array
                    items:
                      $ref: '#/components/schemas/BodyChart'
                  total_entries:
                    type: integer
                    example: 1
                  links:
                    type: object
                    properties:
                      self:
                        type: string
                        format: uri
                        example: https://api.au1.cliniko.com/v1/body_charts?page=2
                      previous:
                        type: string
                        format: uri
                        example: https://api.au1.cliniko.com/v1/body_charts?page=1
                      next:
                        type: string
                        format: uri
                        example: https://api.au1.cliniko.com/v1/body_charts?page=3
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/Order'
      - in: query
        name: q[]
        description: 'Filter result by one or more fields.


          See [Filtering Results](/#filtering-results)


          Available filters:


          | Value | Format |

          |---|---|

          | archived_at | [date-time](/#datetime-filter-operators) |

          | created_at | [date-time](/#datetime-filter-operators) |

          | id | [int64](/#numeric-filter-operators) |

          | treatment_note_id | [int64](/#numeric-filter-operators) |

          | updated_at | [date-time](/#datetime-filter-operators) |

          '
        schema:
          type: array
          items:
            type: string
    servers:
    - url: https://api.au1.cliniko.com/v1
      description: Production
  /body_charts/{id}:
    get:
      tags:
      - Body Chart
      summary: Get body chart
      operationId: GetBodyChart-Get
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BodyChart'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: int64
      - in: query
        name: q[]
        description: 'Filter result by one or more fields.


          See [Filtering Results](/#filtering-results)


          Available filters:


          | Value | Format |

          |---|---|

          | archived_at | [date-time](/#datetime-filter-operators) |

          '
        schema:
          type: array
          items:
            type: string
    servers:
    - url: https://api.au1.cliniko.com/v1
      description: Production
components:
  parameters:
    Order:
      in: query
      name: order
      deprecated: true
      schema:
        type: string
        enum:
        - asc
        - desc
    Sort:
      in: query
      name: sort
      explode: false
      description: 'Comma separated search fields. See: [Ordering](/#ordering)'
      schema:
        type: array
        items:
          type: string
          example: created_at:desc
    Page:
      in: query
      name: page
      schema:
        type: integer
        minimum: 1
    PerPage:
      in: query
      name: per_page
      schema:
        type: integer
        minimum: 1
        maximum: 100
  schemas:
    BodyChart:
      type: object
      properties:
        archived_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
        id:
          type: string
          format: int64
        images:
          type: object
          description: 'Rendered chart images. URLs and thumbnail dimensions are null while processing.

            Follow a non-null image URL with API authentication. A successful request returns

            a 303 redirect to the current storage URL; an unavailable image returns 404.

            '
          properties:
            thumbnail:
              type: object
              properties:
                url:
                  type:
                  - string
                  - 'null'
                  format: uri
                  example: https://api.au1.cliniko.com/v1/body_charts/1/content?size=thumbnail
                height:
                  type:
                  - integer
                  - 'null'
                  example: 200
                width:
                  type:
                  - integer
                  - 'null'
                  example: 300
            full_size:
              type: object
              properties:
                url:
                  type:
                  - string
                  - 'null'
                  format: uri
                  example: https://api.au1.cliniko.com/v1/body_charts/1/content?size=full_size
        links:
          type: object
          properties:
            self:
              type: string
              format: uri
              example: https://api.au1.cliniko.com/v1/body_charts/1
        treatment_note:
          deprecated: false
          type: object
          properties:
            links:
              type: object
              properties:
                self:
                  type: string
                  format: uri
                  example: https://api.au1.cliniko.com/v1/treatment_notes/1
        updated_at:
          type: string
          format: date-time
      x-tags:
      - Body Chart
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
externalDocs:
  description: Clinko API Developers Group
  url: https://groups.google.com/a/redguava.com.au/d/forum/cliniko-api
x-refined-from:
- cliniko-openapi.yml
- cliniko-openapi.yml
