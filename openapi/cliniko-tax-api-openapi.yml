openapi: 3.2.0
info:
  title: Cliniko Tax API
  version: v1
  description: 'Operations tagged Tax across 2 of this provider''s published API definitions: cliniko-openapi.yml, cliniko-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.au1.cliniko.com/v1
  description: Production
security:
- basicAuth: []
tags:
- name: Tax
paths:
  /taxes:
    get:
      tags:
      - Tax
      summary: List taxes
      operationId: ListTaxes-Get
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  taxes:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tax'
                  total_entries:
                    type: integer
                    example: 1
                  links:
                    type: object
                    properties:
                      self:
                        type: string
                        format: uri
                        example: https://api.au1.cliniko.com/v1/taxes?page=2
                      previous:
                        type: string
                        format: uri
                        example: https://api.au1.cliniko.com/v1/taxes?page=1
                      next:
                        type: string
                        format: uri
                        example: https://api.au1.cliniko.com/v1/taxes?page=3
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/Order'
      - in: query
        name: q[]
        description: 'Filter result by one or more fields.


          See [Filtering Results](/#filtering-results)


          Available filters:


          | Value | Format |

          |---|---|

          | created_at | [date-time](/#datetime-filter-operators) |

          | id | [int64](/#numeric-filter-operators) |

          | updated_at | [date-time](/#datetime-filter-operators) |

          '
        schema:
          type: array
          items:
            type: string
    post:
      tags:
      - Tax
      summary: Create tax
      operationId: CreateTax-Post
      responses:
        '201':
          description: Resource was created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tax'
        '422':
          $ref: '#/components/responses/ValidationError'
      requestBody:
        $ref: '#/components/requestBodies/Tax'
    servers:
    - url: https://api.au1.cliniko.com/v1
      description: Production
  /taxes/{id}:
    get:
      tags:
      - Tax
      summary: Get tax
      operationId: GetTax-Get
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tax'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: int64
    patch:
      tags:
      - Tax
      summary: Update tax
      operationId: UpdateTax-Patch
      responses:
        '200':
          description: Resource was updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tax'
        '422':
          $ref: '#/components/responses/ValidationError'
      requestBody:
        $ref: '#/components/requestBodies/Tax'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: int64
    delete:
      tags:
      - Tax
      summary: Delete tax
      operationId: DeleteTax-Delete
      responses:
        '204':
          description: Resource was deleted successfully
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: int64
    servers:
    - url: https://api.au1.cliniko.com/v1
      description: Production
components:
  schemas:
    Tax:
      type: object
      properties:
        amount:
          type: string
          format: decimal
          minimum: 0
          deprecated: true
          exclusiveMaximum: 4000000000
        created_at:
          type: string
          format: date-time
        id:
          type: string
          format: int64
        links:
          type: object
          properties:
            self:
              type: string
              format: uri
              example: https://api.au1.cliniko.com/v1/taxes/1
        name:
          type: string
        rate:
          type: string
          format: decimal
          minimum: 0
          exclusiveMaximum: 4000000000
        updated_at:
          type: string
          format: date-time
      x-tags:
      - Tax
  parameters:
    Sort:
      in: query
      name: sort
      explode: false
      description: 'Comma separated search fields. See: [Ordering](/#ordering)'
      schema:
        type: array
        items:
          type: string
          example: created_at:desc
    Order:
      in: query
      name: order
      deprecated: true
      schema:
        type: string
        enum:
        - asc
        - desc
    Page:
      in: query
      name: page
      schema:
        type: integer
        minimum: 1
    PerPage:
      in: query
      name: per_page
      schema:
        type: integer
        minimum: 1
        maximum: 100
  requestBodies:
    Tax:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              amount:
                type: string
                format: decimal
                minimum: 0
                exclusiveMaximum: 4000000000
              name:
                type: string
              rate:
                type: string
                format: decimal
                minimum: 0
                exclusiveMaximum: 4000000000
  responses:
    ValidationError:
      description: Resource could not be saved due to validation errors
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Validation Failed
              errors:
                type: object
                additionalProperties:
                  type: string
                  x-additionalPropertiesName: error field
                example:
                  api_field: error message
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
externalDocs:
  description: Clinko API Developers Group
  url: https://groups.google.com/a/redguava.com.au/d/forum/cliniko-api
x-refined-from:
- cliniko-openapi.yml
- cliniko-openapi.yml
