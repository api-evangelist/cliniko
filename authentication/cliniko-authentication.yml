generated: '2026-10-21'
method: searched
source: https://docs.api.cliniko.com/
docs: https://docs.api.cliniko.com/index.html.md
summary:
  types:
  - http
schemes:
- name: basicAuth
  type: http
  scheme: basic
  description: >-
    "The Cliniko API uses HTTP Basic authentication." The API key (with or without the shard
    suffix) is the basic-auth username and no password is sent: "Basic " + base64_encode(api_key + ":").
    "Each Cliniko user will have their own API key(s) ... The API key will have the same permissions
    as the user it belongs to." Keys are created in Cliniko under My Info > Manage API keys.
  credential_location: header
  header: Authorization
  key_scope: per-user (inherits the user's permissions; no OAuth scopes)
  key_shard_suffix: The shard is appended to the key (e.g. -au2) and selects https://api.{shard}.cliniko.com/v1; keys with no suffix are au1.
required_headers:
- name: User-Agent
  format: APP_VENDOR_NAME (APP_VENDOR_EMAIL)
  note: If your requests do not include a User-Agent that contains a name and valid contact email, future requests may be automatically blocked.
- name: Accept
  value: application/json
transport: HTTPS only, TLS minimum 1.2
oauth: false
references:
- https://docs.api.cliniko.com/guides/urls.md
- https://help.cliniko.com/en/articles/1023957-generate-a-cliniko-api-key
