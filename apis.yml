  description: >-
    Patients are the people that book in for appointments. There isn't much in Cliniko that doesn't revolve
    around

    patients.


    When you're working with patient information, make sure you abide by the relevant regulations for
    security and

    privacy.


    A couple of fields in the patient record deserve special consideration:


    `accepted_privacy_policy` stores the patient's consent to the business's own privacy policy. Values
    can be null

    (no response), true (accepted) or false (rejected). Please consider how this may affect you storing
    information

    on this patient.


    `time_zone` will contain a valid IANA time zone identifier if the patient's time zone has been set,
    or null if it

    hasn't. It can be set via the API, in which case it accepts IANA time zone identifiers.
