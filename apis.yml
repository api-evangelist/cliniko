    Currently, the following tags are supported: `p`, `div`, `br`, `ul`, `ol`, `li`, `blockquote`, `h1`,
    `h2`,  `b`, `i`, `u`, and `a`.


    The angle bracket characters (`<`, and `>`) should be sent as html encodings (ex: `<` should be sent
